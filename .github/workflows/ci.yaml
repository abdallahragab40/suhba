name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: 'Artifact to build after the checks'
        type: choice
        options: [none, preview, public, e2e]
        default: none

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: App identity files in sync
        run: dart run tool/set_app_identity.dart --check
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - name: Content is valid (draft rules)
        run: dart run tool/content_validate.dart
      - name: Bundled content is up to date
        run: dart run tool/content_build.dart --check
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver benchmark
      - name: Analyze
        run: flutter analyze
      - name: Test (non-golden), with coverage
        run: flutter test --exclude-tags golden --coverage
      - name: Coverage (report only; generated code excluded)
        run: dart run tool/coverage_summary.dart >> "$GITHUB_STEP_SUMMARY"
      - name: Content readiness (report only)
        run: dart run tool/content_readiness.dart >> "$GITHUB_STEP_SUMMARY"

  goldens:
    name: Golden tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden

  # End-to-end flows on an Android emulator and an iOS simulator, plus the
  # host scale benchmark. Manual (build: e2e) until device runners are
  # routine; see docs/performance.md.
  e2e-android:
    name: End-to-end (Android emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.build == 'e2e'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: flutter test integration_test/app_flows_test.dart -d emulator-5554

  e2e-ios:
    name: End-to-end (iOS simulator) and scale benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.build == 'e2e'
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d for x in d[r] if 'iPhone' in x['name']))")
          xcrun simctl boot "$UDID"
          echo "SIM=$UDID" >> "$GITHUB_ENV"
      - run: flutter test integration_test/app_flows_test.dart -d "$SIM"
      - name: Scale benchmark (host VM)
        run: |
          flutter test benchmark/scale_benchmark_test.dart
          { echo '## Scale benchmark (host VM, JIT)'; echo '```json'; cat build/perf/scale_baseline.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Internal preview: draft content, debug-signed APKs for sideloading.
  # Not for the stores (see docs/release.md).
  preview:
    name: Internal preview APK (draft)
    if: github.event_name == 'workflow_dispatch' && inputs.build == 'preview'
    needs: [checks, goldens]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/content_build.dart --check
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - name: Check the bundled content
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            dart run tool/release_check.dart artifact "$apk" --channel=draft
          done
      - uses: actions/upload-artifact@v4
        with:
          name: siyar-sahaba-preview-draft-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

  # The public Android artifact. Every gate runs in this same job, before and
  # after the build: final identity, published content, the complete first
  # release (the Ten, reviewed), real signing, and the content inside the
  # bundle. It fails today by design (no reviewer, placeholder identity).
  public-android:
    name: Public Android bundle
    if: github.event_name == 'workflow_dispatch' && inputs.build == 'public'
    needs: [checks, goldens]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Gates before the build
        run: dart run tool/release_check.dart pre
      - name: Generate the published content
        run: dart run tool/content_build.dart --channel=published
      - name: Signing key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/release.md."
            exit 1
          fi
          mkdir -p keys
          echo "$KEYSTORE_BASE64" | base64 -d > keys/upload-keystore.jks
          {
            echo "storeFile=../keys/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build
        env:
          SIYAR_PUBLIC_BUILD: 'true'
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Gates on the artifact
        run: dart run tool/release_check.dart artifact build/app/outputs/bundle/release/app-release.aab
      - name: Record the build
        run: |
          {
            echo "## Public Android bundle"
            echo "- App version: $(grep '^version:' pubspec.yaml | cut -d' ' -f2) (build ${{ github.run_number }})"
            echo "- Content: $(grep -o '"contentVersion": *"[^"]*"' content/meta.json), published channel"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: siyar-sahaba-public-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
