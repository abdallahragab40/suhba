name: Pages

# Publishes site/ (the privacy policy linked from the store listings) to
# https://abdallahragab40.github.io/suhba/.

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs: deploy-pages only sees the artifact once the job that
  # uploaded it has finished (in one job it fails with "No artifacts named
  # github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
